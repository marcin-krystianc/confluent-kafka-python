# Scratch workflow for testing GitHub Pages deploy replacement.
# Deploys a single page listing the GITHUB_* env vars and the build time, so the
# live site shows which run and attempt produced it.
# Note: a Pages deploy replaces the whole site, so this removes the package index
# until .github/workflows/package.yml deploys again.
name: Pages deploy test


on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      label:
        description: "Free-text label shown on the page, to tell runs apart"
        required: false
        default: ""
      delay_seconds:
        description: "Sleep before deploying, to force two runs to overlap"
        required: false
        default: "0"

jobs:
  deploy_test_page:
    name: Build&deploy a test page
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Generate page
        env:
          LABEL: ${{ inputs.label }}
        run: |
          mkdir -p dist
          # ponytail: no HTML escaping of LABEL; scratch page, input needs write access.
          {
            echo '<!DOCTYPE html>'
            echo '<html>'
            echo '<head><title>Pages deploy test</title><meta name="robots" content="noindex"></head>'
            echo '<body>'
            echo '<h1>Pages deploy test</h1>'
            echo '<pre>'
            echo "page_created_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "label:            ${LABEL}"
            echo "run_attempt_url:  ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
            echo
            env | grep '^GITHUB_' | sort
            echo '</pre>'
            echo '</body>'
            echo '</html>'
          } > dist/index.html
          cat dist/index.html

      - name: Upload Site Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "dist"

      - name: Delay before deploy
        run: sleep "${{ inputs.delay_seconds }}"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Display GitHub Pages URL
        run: |
          echo "Page URL: ${{ steps.deployment.outputs.page_url }}"
          echo "Deployed by run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
